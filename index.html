<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEWORK</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    background:linear-gradient(
        180deg,
        #172b45 0%,
        #254d73 45%,
        #8bbbd8 100%
    );
    color:#eef7ff;
    min-height:100vh;
    padding:24px;
}

.container{
    max-width:920px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:52px;
    color:#e5f5ff;
    letter-spacing:2px;
}

.sub{
    text-align:center;
    color:#d6ebf7;
    margin:8px 0 28px;
}

.box{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px;
    padding:20px;
    margin-bottom:18px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.welcome{
    font-weight:700;
    font-size:18px;
}

.logoutBtn{
    width:auto;
    padding:10px 16px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,.12);
    color:white;
    cursor:pointer;
}

.nav{
    display:flex;
    background:rgba(255,255,255,.08);
    border-radius:999px;
    padding:5px;
    margin-bottom:18px;
}

.navBtn{
    flex:1;
    border:none;
    background:transparent;
    color:#d6ebf7;
    padding:12px;
    border-radius:999px;
    font-weight:700;
    cursor:pointer;
}

.navBtn.active{
    background:#4c9bd1;
    color:white;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    margin:8px 0;
    border-radius:12px;
    border:none;
    background:rgba(255,255,255,.10);
    color:white;
    outline:none;
}

select option{
    background:#254d73;
    color:white;
}

input::placeholder,
textarea::placeholder{
    color:#c9deeb;
}

textarea{
    resize:none;
    height:150px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#4c9bd1;
    color:white;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
}

button:hover{
    opacity:.9;
}

.secondary{
    background:rgba(255,255,255,.12);
}

.filterBox{
    display:flex;
    gap:10px;
    align-items:center;
}

.filterBox select{
    margin:0;
}

.card{
    background:rgba(19,48,72,.85);
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.user{
    color:#91d1ff;
    font-weight:700;
}

.time{
    color:#b9d3e3;
    font-size:13px;
}

.subject{
    display:inline-block;
    background:rgba(76,155,209,.25);
    color:#9ed8ff;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    margin-top:10px;
}

.title{
    font-size:24px;
    font-weight:700;
    margin:10px 0;
}

.content{
    white-space:pre-wrap;
    line-height:1.6;
    color:#e5f2fa;
}

.delete{
    background:#344b5a;
    margin-top:14px;
}

.empty{
    text-align:center;
    padding:30px;
    color:#c5dce9;
}

#app{
    display:none;
}
</style>
</head>

<body>

<div class="container">

    <h1>📚 HOMEWORK</h1>
    <p class="sub">Your homework community.</p>

    <!-- LOGIN -->
    <div id="loginBox" class="box">

        <h2>Login / Sign Up</h2>

        <input
            id="usernameInput"
            placeholder="Username (sign up only)"
        >

        <input
            id="emailInput"
            type="email"
            placeholder="Email"
        >

        <input
            id="passwordInput"
            type="password"
            placeholder="Password"
        >

        <button id="signupBtn">
            Create Account
        </button>

        <button id="loginBtn" class="secondary">
            Login
        </button>

    </div>


    <!-- APP -->
    <div id="app">

        <div class="topbar">

            <div id="welcome" class="welcome"></div>

            <button id="logoutBtn" class="logoutBtn">
                Logout
            </button>

        </div>


        <!-- NAV -->
        <div class="nav">

            <button
                id="postsTab"
                class="navBtn active"
            >
                📚 Homework
            </button>

        </div>


        <!-- HOMEWORK PAGE -->
        <div id="postsPage">

            <!-- CREATE POST -->
            <div class="box">

                <h2>📚 Post Homework</h2>

                <select id="subjectInput">

                    <option value="General">
                        General
                    </option>

                    <option value="Mathematics">
                        Mathematics
                    </option>

                    <option value="English">
                        English
                    </option>

                    <option value="Science">
                        Science
                    </option>

                    <option value="Social Studies">
                        Social Studies
                    </option>

                    <option value="Languages">
                        Languages
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Art">
                        Art
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <input
                    id="titleInput"
                    placeholder="Homework title..."
                >


                <textarea
                    id="textInput"
                    placeholder="Write the homework question, assignment, notes, or anything you need help with..."
                ></textarea>


                <button id="postBtn">
                    📚 Post Homework
                </button>

            </div>


            <!-- FILTER -->
            <div class="box">

                <h3>🔎 Filter Homework</h3>

                <div class="filterBox">

                    <select id="filterSubject">

                        <option value="All">
                            All Subjects
                        </option>

                        <option value="General">
                            General
                        </option>

                        <option value="Mathematics">
                            Mathematics
                        </option>

                        <option value="English">
                            English
                        </option>

                        <option value="Science">
                            Science
                        </option>

                        <option value="Social Studies">
                            Social Studies
                        </option>

                        <option value="Languages">
                            Languages
                        </option>

                        <option value="Technology">
                            Technology
                        </option>

                        <option value="Art">
                            Art
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <!-- POSTS -->
            <div id="posts">

                <div class="empty">
                    Loading homework...
                </div>

            </div>

        </div>

    </div>

</div>


<script type="module">

/* =========================
   FIREBASE
========================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    deleteDoc,
    doc,
    getDocs,
    where
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:"AIzaSyDTgzdADXgjYIIUBHSpVdcE6kBEnvdbCj0",

    authDomain:"tuffmonkey-f75b3.firebaseapp.com",

    projectId:"tuffmonkey-f75b3",

    storageBucket:"tuffmonkey-f75b3.firebasestorage.app",

    messagingSenderId:"897150250440",

    appId:"1:897150250440:web:8a668c17d28074fad264fd"

};


const ADMIN_EMAIL = "monkeymen0706@gmail.com";


const firebaseApp = initializeApp(firebaseConfig);

const db = getFirestore(firebaseApp);

const auth = getAuth(firebaseApp);


/* =========================
   VARIABLES
========================= */

let currentUsername = "";

let isAdmin = false;

let unsubscribePosts = null;

let allPosts = [];


/* =========================
   ELEMENTS
========================= */

const loginBox =
    document.getElementById("loginBox");

const appBox =
    document.getElementById("app");

const welcome =
    document.getElementById("welcome");

const usernameInput =
    document.getElementById("usernameInput");

const emailInput =
    document.getElementById("emailInput");

const passwordInput =
    document.getElementById("passwordInput");

const signupBtn =
    document.getElementById("signupBtn");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const titleInput =
    document.getElementById("titleInput");

const textInput =
    document.getElementById("textInput");

const subjectInput =
    document.getElementById("subjectInput");

const postBtn =
    document.getElementById("postBtn");

const posts =
    document.getElementById("posts");

const filterSubject =
    document.getElementById("filterSubject");


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   SIGN UP
========================= */

signupBtn.onclick = async () => {

    const username =
        usernameInput.value.trim();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!username || !email || !password){

        alert("Fill every box!");

        return;

    }


    if(password.length < 6){

        alert("Password must be at least 6 characters.");

        return;

    }


    try{

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        await addDoc(
            collection(db,"users"),
            {
                uid:userCredential.user.uid,
                username:username
            }
        );


        alert("Welcome to HOMEWORK 📚");

        usernameInput.value = "";

    }
    catch(error){

        alert(error.message);

    }

};


/* =========================
   LOGIN
========================= */

loginBtn.onclick = async () => {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!email || !password){

        alert("Enter your email and password.");

        return;

    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }
    catch(error){

        alert(error.message);

    }

};


/* =========================
   LOGOUT
========================= */

logoutBtn.onclick = async () => {

    await signOut(auth);

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth, async (user) => {

    if(!user){

        loginBox.style.display = "block";

        appBox.style.display = "none";

        currentUsername = "";

        return;

    }


    loginBox.style.display = "none";

    appBox.style.display = "block";


    isAdmin =
        user.email === ADMIN_EMAIL;


    try{

        const userQuery =
            query(
                collection(db,"users"),
                where("uid","==",user.uid)
            );


        const snapshot =
            await getDocs(userQuery);


        if(!snapshot.empty){

            currentUsername =
                snapshot.docs[0].data().username;

        }
        else{

            currentUsername =
                user.email.split("@")[0];

        }


        welcome.innerHTML =
            `📚 ${escapeHTML(currentUsername)}${isAdmin ? " 👑 Admin" : ""}`;


        loadPosts();

    }
    catch(error){

        console.error(error);

        alert(
            "Could not load your account information."
        );

    }

});


/* =========================
   CREATE HOMEWORK POST
========================= */

postBtn.onclick = async () => {

    const title =
        titleInput.value.trim();

    const text =
        textInput.value.trim();

    const subject =
        subjectInput.value;


    if(!title || !text){

        alert("Write a title and homework!");

        return;

    }


    if(!auth.currentUser){

        alert("You must be logged in.");

        return;

    }


    try{

        await addDoc(
            collection(db,"posts"),
            {

                username:currentUsername,

                owner:auth.currentUser.uid,

                subject:subject,

                title:title,

                text:text,

                created:Date.now()

            }
        );


        titleInput.value = "";

        textInput.value = "";

        subjectInput.value = "General";

    }
    catch(error){

        console.error(error);

        alert(
            "Could not post homework: " +
            error.message
        );

    }

};


/* =========================
   LOAD POSTS
========================= */

function loadPosts(){

    if(unsubscribePosts){

        unsubscribePosts();

    }


    const postsQuery =
        query(
            collection(db,"posts"),
            orderBy("created","desc")
        );


    unsubscribePosts =
        onSnapshot(
            postsQuery,
            (snapshot) => {

                allPosts = [];


                snapshot.forEach((postDoc) => {

                    allPosts.push({

                        id:postDoc.id,

                        ...postDoc.data()

                    });

                });


                displayPosts();

            },

            (error) => {

                console.error(error);

                posts.innerHTML = `
                    <div class="empty">
                        Could not load homework.
                        <br><br>
                        ${escapeHTML(error.message)}
                    </div>
                `;

            }
        );

}


/* =========================
   DISPLAY POSTS
========================= */

function displayPosts(){

    const selectedSubject =
        filterSubject.value;


    let filteredPosts =
        allPosts;


    if(selectedSubject !== "All"){

        filteredPosts =
            allPosts.filter(
                post =>
                    (post.subject || "General")
                    === selectedSubject
            );

    }


    if(filteredPosts.length === 0){

        posts.innerHTML = `
            <div class="empty">
                📚 No homework posts yet.
            </div>
        `;

        return;

    }


    posts.innerHTML = "";


    filteredPosts.forEach((post) => {

        const subject =
            post.subject || "General";


        const time =
            post.created
                ? new Date(post.created)
                    .toLocaleString(
                        "en-NZ",
                        {
                            day:"numeric",
                            month:"short",
                            year:"numeric",
                            hour:"numeric",
                            minute:"2-digit"
                        }
                    )
                : "";


        const canDelete =
            auth.currentUser &&
            (
                post.owner === auth.currentUser.uid
                ||
                isAdmin
            );


        const card =
            document.createElement("div");

        card.className = "card";


        card.innerHTML = `

            <div class="header">

                <div class="user">
                    📚 ${escapeHTML(post.username || "Unknown")}
                </div>

                <div class="time">
                    ${escapeHTML(time)}
                </div>

            </div>


            <div class="subject">
                ${escapeHTML(subject)}
            </div>


            <div class="title">
                ${escapeHTML(post.title || "")}
            </div>


            <div class="content">
                ${escapeHTML(post.text || "")}
            </div>

        `;


        if(canDelete){

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete";

            deleteButton.textContent =
                "🗑 Delete";


            deleteButton.onclick =
                async () => {

                    if(
                        !confirm(
                            "Delete this homework post?"
                        )
                    ){

                        return;

                    }


                    try{

                        await deleteDoc(
                            doc(
                                db,
                                "posts",
                                post.id
                            )
                        );

                    }
                    catch(error){

                        alert(
                            "Could not delete post: " +
                            error.message
                        );

                    }

                };


            card.appendChild(deleteButton);

        }


        posts.appendChild(card);

    });

}


/* =========================
   SUBJECT FILTER
========================= */

filterSubject.onchange = () => {

    displayPosts();

};

</script>

</body>
</html>

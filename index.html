<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONKS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}

body{
background:linear-gradient(180deg,#1f3d29 0%,#2f5d3a 45%,#8bcf9c 100%);
color:#eefaf0;
min-height:100vh;
padding:24px;
}

.container{max-width:920px;margin:auto}

h1{
text-align:center;
font-size:52px;
color:#d8ffe0;
letter-spacing:2px;
}

.sub{
text-align:center;
color:#d7f5dc;
margin:8px 0 28px;
}

.box{
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:22px;
padding:20px;
margin-bottom:18px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.welcome{
font-weight:700;
font-size:18px;
}

.logoutBtn{
width:auto;
padding:10px 16px;
border:none;
border-radius:10px;
background:rgba(255,255,255,.12);
color:white;
cursor:pointer;
}

.nav{
display:flex;
background:rgba(255,255,255,.08);
border-radius:999px;
padding:5px;
margin-bottom:18px;
gap:6px;
}

.navBtn{
flex:1;
border:none;
background:transparent;
color:#d7f5dc;
padding:12px;
border-radius:999px;
font-weight:700;
cursor:pointer;
}

.navBtn.active{
background:#58b66a;
color:white;
}

input,textarea,select{
width:100%;
padding:13px;
margin:8px 0;
border-radius:12px;
border:none;
background:rgba(255,255,255,.10);
color:white;
}

select option{
background:#295337;
color:white;
}

input::placeholder,
textarea::placeholder{
color:#cce8d1;
}

textarea{
resize:none;
height:130px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#58b66a;
color:white;
font-weight:700;
cursor:pointer;
margin-top:8px;
}

.secondary{
background:rgba(255,255,255,.12);
}

.card{
background:rgba(22,55,32,.82);
border-radius:18px;
padding:18px;
margin-bottom:14px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
}

.user{
color:#9af5a8;
font-weight:700;
}

.time{
color:#bddfc5;
font-size:13px;
}

.title{
font-size:24px;
font-weight:700;
margin:10px 0;
}

.content{
white-space:pre-wrap;
line-height:1.6;
}

.delete{
background:#324d39;
margin-top:14px;
}

.result{
margin-top:18px;
padding:18px;
background:rgba(255,255,255,.08);
border-radius:16px;
text-align:center;
}

.personality{
text-align:left;
margin-top:12px;
padding:12px;
background:rgba(255,255,255,.06);
border-radius:12px;
}

#app,
#randomPage,
#quizPage{
display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>🐒 MONKS</h1>
<p class="sub">The jungle's community feed.</p>

<div id="loginBox" class="box">

<h2>Login / Sign Up</h2>

<input id="username" placeholder="Username (sign up only)">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button id="signup">Create Account</button>
<button id="login" class="secondary">Login</button>

</div>

<div id="app">

<div class="topbar">
<div id="welcome" class="welcome"></div>
<button id="logout" class="logoutBtn">Logout</button>
</div>

<div class="nav">
<button id="postsTab" class="navBtn active">🌍 Public</button>
<button id="randomTab" class="navBtn">🎲 Random</button>
<button id="quizTab" class="navBtn">🧠 Quiz</button>
</div>

<!-- PUBLIC POSTS -->

<div id="postsPage">

<div class="box">

<h2>Create Post</h2>

<input id="title" placeholder="Post title...">

<textarea id="text" placeholder="What's happening in the jungle?"></textarea>

<button id="post">Post</button>

</div>

<div id="posts"></div>

</div>

<!-- RANDOM COMPATIBILITY -->

<div id="randomPage">

<div class="box">

<h2>🎲 Random Compatibility</h2>

<input id="person1" placeholder="First username">
<input id="person2" placeholder="Second username">

<button id="testLove">Reveal Compatibility ❤️</button>

<div id="loveResult" class="result"></div>

</div>

</div>

<!-- QUIZ COMPATIBILITY -->

<div id="quizPage">

<div class="box">

<h2>🧠 Personality Compatibility Quiz</h2>

<h3>🐵 Person A</h3>

<input id="nameA" placeholder="Username">

<label>Ideal Friday?</label>
<select id="a1">
<option value="romantic">Date night</option>
<option value="chaotic">Gaming marathon</option>
<option value="chill">Sleeping</option>
<option value="ambitious">Working on goals</option>
</select>

<label>Texting style?</label>
<select id="a2">
<option value="romantic">Replies instantly</option>
<option value="chaotic">Only memes</option>
<option value="chill">Replies whenever</option>
<option value="ambitious">Straight to the point</option>
</select>

<label>Dream holiday?</label>
<select id="a3">
<option value="romantic">Paris</option>
<option value="chaotic">Tokyo</option>
<option value="chill">Maldives</option>
<option value="ambitious">New York</option>
</select>

---

<h3>🐵 Person B</h3>

<input id="nameB" placeholder="Username">

<label>Ideal Friday?</label>
<select id="b1">
<option value="romantic">Date night</option>
<option value="chaotic">Gaming marathon</option>
<option value="chill">Sleeping</option>
<option value="ambitious">Working on goals</option>
</select>

<label>Texting style?</label>
<select id="b2">
<option value="romantic">Replies instantly</option>
<option value="chaotic">Only memes</option>
<option value="chill">Replies whenever</option>
<option value="ambitious">Straight to the point</option>
</select>

<label>Dream holiday?</label>
<select id="b3">
<option value="romantic">Paris</option>
<option value="chaotic">Tokyo</option>
<option value="chill">Maldives</option>
<option value="ambitious">New York</option>
</select>

<button id="calculateLove">Calculate Compatibility ❤️</button>

<div id="quizResult" class="result"></div>

</div>

</div>

</div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  deleteDoc,
  doc,
  getDocs,
  where
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

// ---------------- FIREBASE ----------------

const firebaseConfig = {
  apiKey:"AIzaSyDTgzdADXgjYIIUBHSpVdcE6kBEnvdbCj0",
  authDomain:"tuffmonkey-f75b3.firebaseapp.com",
  projectId:"tuffmonkey-f75b3",
  storageBucket:"tuffmonkey-f75b3.firebasestorage.app",
  messagingSenderId:"897150250440",
  appId:"1:897150250440:web:8a668c17d28074fad264fd"
};

const ADMIN_EMAIL="monkeymen0706@gmail.com";

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let currentUsername="";
let isAdmin=false;

// ---------------- ELEMENTS ----------------

const loginBox=document.getElementById("loginBox");
const appBox=document.getElementById("app");
const welcome=document.getElementById("welcome");
const posts=document.getElementById("posts");

const postsPage=document.getElementById("postsPage");
const randomPage=document.getElementById("randomPage");
const quizPage=document.getElementById("quizPage");

// ---------------- AUTH ----------------

signup.onclick=async()=>{

  const username=username.value.trim();
  const email=email.value.trim();
  const password=password.value;

  if(!username||!email||!password){
    alert("Fill every box!");
    return;
  }

  try{

    const user=await createUserWithEmailAndPassword(auth,email,password);

    await addDoc(collection(db,"users"),{
      uid:user.user.uid,
      username
    });

    alert("Welcome to MONKS 🐒");

  }catch(err){
    alert(err.message);
  }

};

login.onclick=async()=>{

  try{

    await signInWithEmailAndPassword(
      auth,
      email.value.trim(),
      password.value
    );

  }catch(err){
    alert(err.message);
  }

};

logout.onclick=()=>signOut(auth);

onAuthStateChanged(auth,async(user)=>{

  if(!user){
    loginBox.style.display="block";
    appBox.style.display="none";
    return;
  }

  loginBox.style.display="none";
  appBox.style.display="block";

  isAdmin=user.email===ADMIN_EMAIL;

  const snap=await getDocs(
    query(collection(db,"users"),where("uid","==",user.uid))
  );

  currentUsername=snap.docs[0].data().username;

  welcome.innerHTML=`🐒 ${currentUsername}${isAdmin?" 👑 Alpha Monk":""}`;

  loadPosts();

});

// ---------------- TABS ----------------

postsTab.onclick=()=>{

  postsPage.style.display="block";
  randomPage.style.display="none";
  quizPage.style.display="none";

  postsTab.classList.add("active");
  randomTab.classList.remove("active");
  quizTab.classList.remove("active");

};

randomTab.onclick=()=>{

  postsPage.style.display="none";
  randomPage.style.display="block";
  quizPage.style.display="none";

  randomTab.classList.add("active");
  postsTab.classList.remove("active");
  quizTab.classList.remove("active");

};

quizTab.onclick=()=>{

  postsPage.style.display="none";
  randomPage.style.display="none";
  quizPage.style.display="block";

  quizTab.classList.add("active");
  postsTab.classList.remove("active");
  randomTab.classList.remove("active");

};

// ---------------- POSTS ----------------

post.onclick=async()=>{

  const t=title.value.trim();
  const txt=text.value.trim();

  if(!t||!txt){
    alert("Write something!");
    return;
  }

  await addDoc(collection(db,"posts"),{
    username:currentUsername,
    owner:auth.currentUser.uid,
    title:t,
    text:txt,
    created:Date.now()
  });

  title.value="";
  text.value="";

};

function loadPosts(){

  const q=query(collection(db,"posts"),orderBy("created","desc"));

  onSnapshot(q,(snapshot)=>{

    posts.innerHTML="";

    snapshot.forEach((p)=>{

      const d=p.data();

      const time=new Date(d.created).toLocaleString("en-NZ",{
        day:"numeric",
        month:"short",
        hour:"numeric",
        minute:"2-digit"
      });

      posts.innerHTML+=`
      <div class="card">

        <div class="header">
          <div class="user">🐵 ${d.username}</div>
          <div class="time">${time}</div>
        </div>

        <div class="title">${d.title}</div>
        <div class="content">${d.text}</div>

        ${(d.owner===auth.currentUser.uid||isAdmin)?
        `<button class="delete" onclick="window.del('${p.id}')">🗑 Delete</button>`:""}

      </div>`;
    });

  });

}

window.del=async(id)=>{

  if(confirm("Delete this post?")){
    await deleteDoc(doc(db,"posts",id));
  }

};

// ---------------- RANDOM COMPATIBILITY ----------------

const personalities=[
"Golden Retriever","Black Cat","Chaos Goblin","Gym Rat","Night Owl",
"Softie","Main Character","Overthinker","Green Flag","Red Flag",
"Hopeless Romantic","Yapper","Quiet Genius","Coffee Addict","Professional Hater",
"Drama Queen","Clingy","Independent","Walking Meme","Artist",
"Gamer","Bookworm","Beach Lover","Skater","Tea Lover",
"Plant Parent","Dog Lover","Cat Whisperer","Streetwear King","Minimalist",
"Chaotic Good","Lawful Good","Chaotic Evil","Lucky Duck","Space Nerd",
"Science Geek","History Buff","TikTok Addict","Sleep Deprived","Therapist Friend",
"Mom Friend","Dad Friend","Pirate Energy","Wizard Vibes","Vampire Energy",
"Angel Aura","Fairy Core","Sarcastic Menace","Flirty Menace","Cottagecore"
];

const randomComments=[
"💍 Soulmates",
"🥹 Destined to be together",
"💚 Cute couple",
"😳 There's chemistry",
"🤝 Better as friends",
"💀 Absolutely cursed duo",
"⚠️ Stay away from each other"
];

testLove.onclick=()=>{

  const a=person1.value.trim();
  const b=person2.value.trim();

  if(!a||!b){
    alert("Enter two usernames!");
    return;
  }

  const p1=personalities[Math.floor(Math.random()*personalities.length)];
  const p2=personalities[Math.floor(Math.random()*personalities.length)];

  const percent=Math.floor(Math.random()*101);
  const comment=randomComments[Math.floor(Math.random()*randomComments.length)];

  loveResult.innerHTML=`
    <h1>${percent}%</h1>
    <h2>${a} ❤️ ${b}</h2>

    <div class="personality">
      <p><b>🐵 ${a}</b></p>
      <p>✨ ${p1}</p>
      <br>
      <p><b>🐵 ${b}</b></p>
      <p>✨ ${p2}</p>
    </div>

    <h3 style="margin-top:16px">${comment}</h3>
  `;

};

// ---------------- QUIZ COMPATIBILITY ----------------

const types={
romantic:"💖 Hopeless Romantic",
chaotic:"⚡ Chaos Gremlin",
chill:"🌿 Chill Soul",
ambitious:"🚀 Ambitious Legend"
};

function personality(prefix){

  const score={
    romantic:0,
    chaotic:0,
    chill:0,
    ambitious:0
  };

  score[document.getElementById(prefix+"1").value]++;
  score[document.getElementById(prefix+"2").value]++;
  score[document.getElementById(prefix+"3").value]++;

  return Object.keys(score).reduce((a,b)=>score[a]>=score[b]?a:b);

}

calculateLove.onclick=()=>{

  const A=nameA.value||"Person A";
  const B=nameB.value||"Person B";

  const pA=personality("a");
  const pB=personality("b");

  let score=45;

  if(pA===pB) score+=35;

  if(
    (pA==="romantic"&&pB==="chill")||
    (pA==="chill"&&pB==="romantic")
  ) score+=20;

  if(
    (pA==="chaotic"&&pB==="ambitious")||
    (pA==="ambitious"&&pB==="chaotic")
  ) score+=15;

  score+=Math.floor(Math.random()*11)-5;
  score=Math.max(0,Math.min(100,score));

  let verdict="🤝 Better as friends";

  if(score>=95) verdict="💍 Soulmates";
  else if(score>=80) verdict="🥹 Destined to be together";
  else if(score>=65) verdict="💚 Great chemistry";
  else if(score>=50) verdict="😳 Could definitely work";
  else if(score>=25) verdict="🤔 Mixed signals";
  else verdict="💀 Stay away from each other";

  quizResult.innerHTML=`
    <h1>${score}%</h1>
    <h2>${A} ❤️ ${B}</h2>

    <div class="personality">
      <p><b>🐵 ${A}</b></p>
      <p>${types[pA]}</p>
      <br>
      <p><b>🐵 ${B}</b></p>
      <p>${types[pB]}</p>
    </div>

    <h3 style="margin-top:16px">${verdict}</h3>
  `;

};

</script>
</body>
</html>

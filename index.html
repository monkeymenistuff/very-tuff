<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONKS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}

body{
  background:linear-gradient(180deg,#1f3d29 0%,#2f5d3a 45%,#8bcf9c 100%);
  color:#eefaf0;
  min-height:100vh;
  padding:24px;
}

.container{max-width:920px;margin:auto}

h1{
  text-align:center;
  font-size:52px;
  color:#d8ffe0;
  letter-spacing:2px;
}

.sub{
  text-align:center;
  color:#d7f5dc;
  margin:8px 0 28px;
}

.box{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.15);
  border-radius:22px;
  padding:20px;
  margin-bottom:18px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.welcome{
  font-weight:700;
  font-size:18px;
}

.logoutBtn{
  width:auto;
  padding:10px 16px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,.12);
  color:white;
  cursor:pointer;
}

.nav{
  display:flex;
  background:rgba(255,255,255,.08);
  border-radius:999px;
  padding:5px;
  margin-bottom:18px;
}

.navBtn{
  flex:1;
  border:none;
  background:transparent;
  color:#d7f5dc;
  padding:12px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
}

.navBtn.active{
  background:#58b66a;
  color:white;
}

input,textarea{
  width:100%;
  padding:13px;
  margin:8px 0;
  border-radius:12px;
  border:none;
  background:rgba(255,255,255,.10);
  color:white;
}

input::placeholder,
textarea::placeholder{
  color:#cce8d1;
}

textarea{
  resize:none;
  height:130px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#58b66a;
  color:white;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
}

.secondary{
  background:rgba(255,255,255,.12);
}

.card{
  background:rgba(22,55,32,.82);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.user{
  color:#9af5a8;
  font-weight:700;
}

.time{
  color:#bddfc5;
  font-size:13px;
}

.title{
  font-size:24px;
  font-weight:700;
  margin:10px 0;
}

.content{
  white-space:pre-wrap;
  line-height:1.6;
}

.delete{
  background:#324d39;
  margin-top:14px;
}

.users{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:12px;
}

.userBtn{
  background:rgba(255,255,255,.08);
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}

.msg{
  max-width:72%;
  padding:10px 14px;
  border-radius:16px;
  margin:8px 0;
}

.me{
  background:#58b66a;
  margin-left:auto;
}

.them{
  background:#355c41;
}

#app,
#dmPage{
  display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>🐒 MONKS</h1>
<p class="sub">The jungle's community feed.</p>

<div id="loginBox" class="box">
  <h2>Login / Sign Up</h2>

  <input id="username" placeholder="Username (sign up only)">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="signup">Create Account</button>
  <button id="login" class="secondary">Login</button>
</div>

<div id="app">

  <div class="topbar">
    <div id="welcome" class="welcome"></div>
    <button id="logout" class="logoutBtn">Logout</button>
  </div>

  <div class="nav">
    <button id="postsTab" class="navBtn active">🌍 Public</button>
    <button id="dmTab" class="navBtn">💬 DMs</button>
  </div>

  <div id="postsPage">

    <div class="box">
      <h2>Create Post</h2>

      <input id="title" placeholder="Post title...">
      <textarea id="text" placeholder="What's happening in the jungle?"></textarea>

      <button id="post">Post</button>
    </div>

    <div id="posts"></div>

  </div>

  <div id="dmPage">

    <div class="box">
      <h2>Direct Messages</h2>

      <div id="userList" class="users"></div>

      <div id="chat"></div>

      <textarea id="msgInput" placeholder="Type a message..."></textarea>

      <button id="send">Send</button>
    </div>

  </div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  deleteDoc,
  doc,
  getDocs,
  where
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyDTgzdADXgjYIIUBHSpVdcE6kBEnvdbCj0",
  authDomain:"tuffmonkey-f75b3.firebaseapp.com",
  projectId:"tuffmonkey-f75b3",
  storageBucket:"tuffmonkey-f75b3.firebasestorage.app",
  messagingSenderId:"897150250440",
  appId:"1:897150250440:web:8a668c17d28074fad264fd"
};

const ADMIN_EMAIL = "monkeymen0706@gmail.com";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUsername = "";
let isAdmin = false;
let selectedUser = null;

const loginBox = document.getElementById("loginBox");
const appBox = document.getElementById("app");
const welcome = document.getElementById("welcome");
const posts = document.getElementById("posts");
const userList = document.getElementById("userList");
const chat = document.getElementById("chat");

const postsPage = document.getElementById("postsPage");
const dmPage = document.getElementById("dmPage");

// SIGN UP
document.getElementById("signup").onclick = async () => {

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!username || !email || !password){
    alert("Fill every box!");
    return;
  }

  try{

    const user = await createUserWithEmailAndPassword(auth,email,password);

    await addDoc(collection(db,"users"),{
      uid:user.user.uid,
      username
    });

    alert("Welcome to MONKS 🐒");

  }catch(err){
    alert(err.message);
  }

};

// LOGIN
document.getElementById("login").onclick = async () => {

  try{
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    );
  }catch(err){
    alert(err.message);
  }

};

// LOGOUT
document.getElementById("logout").onclick = ()=> signOut(auth);

// AUTH
onAuthStateChanged(auth, async(user)=>{

  if(!user){
    loginBox.style.display="block";
    appBox.style.display="none";
    return;
  }

  loginBox.style.display="none";
  appBox.style.display="block";

  isAdmin = user.email === ADMIN_EMAIL;

  const snap = await getDocs(
    query(collection(db,"users"),where("uid","==",user.uid))
  );

  currentUsername = snap.docs[0].data().username;

  welcome.innerHTML =
    `🐒 ${currentUsername}${isAdmin?" 👑 Alpha Monk":""}`;

  loadPosts();
  loadUsers();

});

// TAB SWITCHING
document.getElementById("postsTab").onclick=()=>{

  postsPage.style.display="block";
  dmPage.style.display="none";

  document.getElementById("postsTab").classList.add("active");
  document.getElementById("dmTab").classList.remove("active");

};

document.getElementById("dmTab").onclick=()=>{

  postsPage.style.display="none";
  dmPage.style.display="block";

  document.getElementById("dmTab").classList.add("active");
  document.getElementById("postsTab").classList.remove("active");

};

// CREATE POST
document.getElementById("post").onclick = async()=>{

  const title=document.getElementById("title").value.trim();
  const text=document.getElementById("text").value.trim();

  if(!title||!text){
    alert("Write something!");
    return;
  }

  await addDoc(collection(db,"posts"),{

    username:currentUsername,
    owner:auth.currentUser.uid,
    title,
    text,
    created:Date.now()

  });

  document.getElementById("title").value="";
  document.getElementById("text").value="";

};

// LOAD POSTS
function loadPosts(){

  const q=query(collection(db,"posts"),orderBy("created","desc"));

  onSnapshot(q,(snapshot)=>{

    posts.innerHTML="";

    snapshot.forEach((post)=>{

      const d=post.data();

      const time=new Date(d.created).toLocaleString("en-NZ",{
        day:"numeric",
        month:"short",
        hour:"numeric",
        minute:"2-digit"
      });

      posts.innerHTML+=`

      <div class="card">

        <div class="header">

          <div class="user">🐵 ${d.username}</div>

          <div class="time">${time}</div>

        </div>

        <div class="title">${d.title}</div>

        <div class="content">${d.text}</div>

        ${(d.owner===auth.currentUser.uid||isAdmin)?`

        <button class="delete"
        onclick="window.del('${post.id}')">

        🗑 Delete

        </button>

        `:""}

      </div>

      `;

    });

  });

}

// DELETE POST
window.del=async(id)=>{

  if(confirm("Delete this post?")){

    await deleteDoc(doc(db,"posts",id));

  }

};

// ==========================
// FIXED LOAD USERS
// ==========================
function loadUsers(){

  const q = query(collection(db,"users"));

  onSnapshot(q,(snapshot)=>{

    userList.innerHTML = "";

    snapshot.forEach((u)=>{

      const d = u.data();

      if(d.uid === auth.currentUser.uid) return;

      const btn = document.createElement("div");
      btn.className = "userBtn";
      btn.textContent = "🐵 " + d.username;

      btn.onclick = () => openChat(d.uid, d.username);

      userList.appendChild(btn);

    });

  });

}

// OPEN CHAT
function openChat(uid,name){

  selectedUser = {uid,name};

  chat.innerHTML=`<p style="color:#9af5a8">
  Chatting with <b>${name}</b></p>`;

  const q=query(collection(db,"messages"),orderBy("created"));

  onSnapshot(q,(snapshot)=>{

    chat.innerHTML=`<p style="color:#9af5a8">
    Chatting with <b>${name}</b></p>`;

    snapshot.forEach((m)=>{

      const d=m.data();

      const valid=
      (d.fromUid===auth.currentUser.uid&&d.toUid===uid)||
      (d.fromUid===uid&&d.toUid===auth.currentUser.uid);

      if(!valid)return;

      chat.innerHTML+=`

      <div class="msg ${d.fromUid===auth.currentUser.uid?"me":"them"}">

      ${d.text}

      </div>

      `;

    });

    chat.scrollTop=chat.scrollHeight;

  });

}

// SEND MESSAGE
document.getElementById("send").onclick = async () => {

  if (!selectedUser) {
    alert("Choose someone first!");
    return;
  }

  const text = document.getElementById("msgInput").value.trim();
  if (!text) return;

  try {
    await addDoc(collection(db, "messages"), {
      fromUid: auth.currentUser.uid,
      fromName: currentUsername,
      toUid: selectedUser.uid,
      toName: selectedUser.name,
      text: text,
      created: Date.now()
    });

    document.getElementById("msgInput").value = "";

  } catch (err) {
    alert(err.message);
    console.error(err);
  }

};

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Very Tuff</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:white;padding:25px}
.container{max-width:850px;margin:auto}
h1{text-align:center;font-size:42px;margin-bottom:8px}
.sub{text-align:center;color:#94a3b8;margin-bottom:25px}

.box{
background:#1e293b;
border:2px solid #334155;
border-radius:18px;
padding:20px;
margin-bottom:25px;
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#334155;
color:white;
font-size:15px;
}

textarea{height:90px;resize:none}
.row{display:flex;gap:10px}

button{
width:100%;
padding:13px;
margin-top:10px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{background:#1d4ed8}
.secondary{background:#475569}
.secondary:hover{background:#64748b}

.card{
background:linear-gradient(145deg,#1f2937,#111827);
border:2px solid #475569;
border-radius:18px;
padding:20px;
margin-bottom:18px;
}

.top{display:flex;align-items:center;gap:15px}
.avatar{
width:65px;height:65px;border-radius:50%;
background:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
}

.name{font-size:24px;font-weight:bold}
.age{color:#94a3b8}
.bio{margin:15px 0;line-height:1.5}

.tags span{
display:inline-block;
background:#334155;
padding:7px 12px;
border-radius:20px;
margin:4px;
}

.emoji{font-size:30px;margin-top:12px}

.delete{
background:#334155;
border:1px solid #475569;
}

#app{display:none}
</style>
</head>

<body>

<div class="container">

<h1>🔥 VERY TUFF</h1>
<p class="sub">Community Profiles</p>

<div id="loginBox" class="box">
<h2>Login / Sign Up</h2>

<input id="username" placeholder="Username (for sign up)">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button id="signupBtn">Create Account</button>
<button id="loginBtn" class="secondary">Login</button>
</div>

<div id="app">

<div class="box">
<h2 id="welcome">Welcome</h2>
<button id="logoutBtn" class="secondary">Logout</button>
</div>

<div class="box">
<h2>Create Profile</h2>

<input id="age" type="number" placeholder="Age">

<div class="row">
<input id="emoji" placeholder="Emoji 😎">
<input id="word1" placeholder="Word 1">
</div>

<div class="row">
<input id="word2" placeholder="Word 2">
<input id="word3" placeholder="Word 3">
</div>

<textarea id="bio" placeholder="Tell everyone about yourself..."></textarea>

<button id="createBtn">Post Profile</button>
</div>

<div id="profiles"></div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTgzdADXgjYIIUBHSpVdcE6kBEnvdbCj0",
  authDomain: "tuffmonkey-f75b3.firebaseapp.com",
  projectId: "tuffmonkey-f75b3",
  storageBucket: "tuffmonkey-f75b3.firebasestorage.app",
  messagingSenderId: "897150250440",
  appId: "1:897150250440:web:8a668c17d28074fad264fd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// CREATE ACCOUNT
document.getElementById("signupBtn").addEventListener("click", async () => {
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !email || !password) {
    alert("Fill in every box!");
    return;
  }

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);

    await addDoc(collection(db, "users"), {
      uid: cred.user.uid,
      username: username
    });

    alert("Account created! You can now log in.");
  } catch (e) {
    alert(e.message);
  }
});

// LOGIN
document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    alert("Logged in!");
  } catch (e) {
    alert(e.message);
  }
});
</script>
</body>
</html>

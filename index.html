<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONKS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{
  background:linear-gradient(180deg,#1f3d29 0%,#2f5d3a 45%,#8bcf9c 100%);
  color:#eefaf0;
  min-height:100vh;
  padding:24px;
}
.container{max-width:920px;margin:auto}
h1{text-align:center;font-size:52px;color:#d8ffe0;letter-spacing:2px}
.sub{text-align:center;color:#d7f5dc;margin:8px 0 28px}
.box{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.15);
  border-radius:22px;
  padding:20px;
  margin-bottom:18px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.welcome{font-weight:700;font-size:18px}
.logoutBtn{
  width:auto;
  padding:10px 16px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,.12);
  color:white;
  cursor:pointer;
}
.nav{
  display:flex;
  background:rgba(255,255,255,.08);
  border-radius:999px;
  padding:5px;
  margin-bottom:18px;
}
.navBtn{
  flex:1;
  border:none;
  background:transparent;
  color:#d7f5dc;
  padding:12px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
}
.navBtn.active{background:#58b66a;color:white}
input,textarea{
  width:100%;
  padding:13px;
  margin:8px 0;
  border-radius:12px;
  border:none;
  background:rgba(255,255,255,.10);
  color:white;
}
input::placeholder,textarea::placeholder{color:#cce8d1}
textarea{resize:none;height:130px}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#58b66a;
  color:white;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
}
.secondary{background:rgba(255,255,255,.12)}
.card{
  background:rgba(22,55,32,.82);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.user{color:#9af5a8;font-weight:700}
.time{color:#bddfc5;font-size:13px}
.title{font-size:24px;font-weight:700;margin:10px 0}
.content{white-space:pre-wrap;line-height:1.6}
.delete{background:#324d39;margin-top:14px}
#app,#lovePage{display:none}
</style>
</head>

<body>

<div class="container">

<h1>🐒 MONKS</h1>
<p class="sub">The jungle's community feed.</p>

<div id="loginBox" class="box">
  <h2>Login / Sign Up</h2>

  <input id="username" placeholder="Username (sign up only)">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="signup">Create Account</button>
  <button id="login" class="secondary">Login</button>
</div>

<div id="app">

  <div class="topbar">
    <div id="welcome" class="welcome"></div>
    <button id="logout" class="logoutBtn">Logout</button>
  </div>

  <div class="nav">
    <button id="postsTab" class="navBtn active">🌍 Public</button>
    <button id="loveTab" class="navBtn">❤️ Compatibility</button>
  </div>

  <div id="postsPage">

    <div class="box">
      <h2>Create Post</h2>

      <input id="title" placeholder="Post title...">
      <textarea id="text" placeholder="What's happening in the jungle?"></textarea>

      <button id="post">Post</button>
    </div>

    <div id="posts"></div>

  </div>

  <div id="lovePage">

    <div class="box">
      <h2>❤️ Compatibility Test</h2>

      <input id="person1" placeholder="First username">
      <input id="person2" placeholder="Second username">

      <button id="testLove">Reveal Compatibility</button>

      <div id="loveResult" style="text-align:center;margin-top:18px;"></div>
    </div>

  </div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  deleteDoc,
  doc,
  getDocs,
  where
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyDTgzdADXgjYIIUBHSpVdcE6kBEnvdbCj0",
  authDomain:"tuffmonkey-f75b3.firebaseapp.com",
  projectId:"tuffmonkey-f75b3",
  storageBucket:"tuffmonkey-f75b3.firebasestorage.app",
  messagingSenderId:"897150250440",
  appId:"1:897150250440:web:8a668c17d28074fad264fd"
};

const ADMIN_EMAIL="monkeymen0706@gmail.com";

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let currentUsername="";
let isAdmin=false;

const loginBox=document.getElementById("loginBox");
const appBox=document.getElementById("app");
const welcome=document.getElementById("welcome");
const posts=document.getElementById("posts");

const postsPage=document.getElementById("postsPage");
const lovePage=document.getElementById("lovePage");

// SIGN UP
document.getElementById("signup").onclick=async()=>{

  const username=document.getElementById("username").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!username||!email||!password){
    alert("Fill every box!");
    return;
  }

  try{

    const user=await createUserWithEmailAndPassword(auth,email,password);

    await addDoc(collection(db,"users"),{
      uid:user.user.uid,
      username
    });

    alert("Welcome to MONKS 🐒");

  }catch(err){
    alert(err.message);
  }

};

// LOGIN
document.getElementById("login").onclick=async()=>{

  try{

    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    );

  }catch(err){
    alert(err.message);
  }

};

// LOGOUT
document.getElementById("logout").onclick=()=>signOut(auth);

// AUTH
onAuthStateChanged(auth,async(user)=>{

  if(!user){
    loginBox.style.display="block";
    appBox.style.display="none";
    return;
  }

  loginBox.style.display="none";
  appBox.style.display="block";

  isAdmin=user.email===ADMIN_EMAIL;

  const snap=await getDocs(
    query(collection(db,"users"),where("uid","==",user.uid))
  );

  currentUsername=snap.docs[0].data().username;

  welcome.innerHTML=`🐒 ${currentUsername}${isAdmin?" 👑 Alpha Monk":""}`;

  loadPosts();

});

// TAB SWITCHING
postsTab.onclick=()=>{
  postsPage.style.display="block";
  lovePage.style.display="none";
  postsTab.classList.add("active");
  loveTab.classList.remove("active");
};

loveTab.onclick=()=>{
  postsPage.style.display="none";
  lovePage.style.display="block";
  loveTab.classList.add("active");
  postsTab.classList.remove("active");
};

// CREATE POST
post.onclick=async()=>{

  const title=document.getElementById("title").value.trim();
  const text=document.getElementById("text").value.trim();

  if(!title||!text){
    alert("Write something!");
    return;
  }

  await addDoc(collection(db,"posts"),{
    username:currentUsername,
    owner:auth.currentUser.uid,
    title,
    text,
    created:Date.now()
  });

  title.value="";
  text.value="";
};

// LOAD POSTS
function loadPosts(){

  const q=query(collection(db,"posts"),orderBy("created","desc"));

  onSnapshot(q,(snapshot)=>{

    posts.innerHTML="";

    snapshot.forEach((post)=>{

      const d=post.data();

      const time=new Date(d.created).toLocaleString("en-NZ",{
        day:"numeric",
        month:"short",
        hour:"numeric",
        minute:"2-digit"
      });

      posts.innerHTML+=`
      <div class="card">

        <div class="header">
          <div class="user">🐵 ${d.username}</div>
          <div class="time">${time}</div>
        </div>

        <div class="title">${d.title}</div>

        <div class="content">${d.text}</div>

        ${(d.owner===auth.currentUser.uid||isAdmin)?
        `<button class="delete" onclick="window.del('${post.id}')">🗑 Delete</button>`
        :""}

      </div>`;
    });

  });

}

// DELETE
window.del=async(id)=>{

  if(confirm("Delete this post?")){
    await deleteDoc(doc(db,"posts",id));
  }

};

// ❤️ COMPATIBILITY
const personalities = [
"Golden Retriever","Black Cat","Hopeless Romantic","Chaos Goblin","Gym Rat","Night Owl","Class Clown","Quiet Genius","Drama Queen","Green Flag",
"Red Flag","Coffee Addict","Overthinker","Flirty Menace","Softie","Main Character","Professional Hater","Yapper","Mysterious Introvert","Sunshine Soul",
"Bookworm","Gamer","Plant Parent","Cat Whisperer","Dog Lover","Fashion Icon","Anime Addict","Movie Buff","Music Nerd","Skater",
"Artist","Poet","Chef","Baker","Tea Lover","Adrenaline Junkie","Beach Lover","Mountain Explorer","Hopeless Flirt","Shy Bean",
"Protective Friend","Loyal Legend","Walking Meme","Sleep Deprived","Rich Energy","Broke Energy","Party Animal","Homebody","Serial Texter","Ghoster",
"Emoji Spammer","Late Replier","Early Bird","Deep Thinker","Sarcastic Menace","Sweetheart","Villain Arc","Soft Spoken","Competitive","People Pleaser",
"Chaotic Good","Lawful Good","Lawful Evil","Chaotic Evil","Lucky Charm","Unlucky","Secret Genius","Tiny Menace","Tall Energy","Short King/Queen",
"Pink Princess","Dark Academia","Cottagecore","Streetwear King","Minimalist","Messy Room","Organised Freak","Clingy","Independent","Hopeless Dreamer",
"Reality Checker","Therapist Friend","Mom Friend","Dad Friend","Conspiracy Theorist","TikTok Addict","Instagram Model","Discord Goblin","Study Machine","Procrastinator",
"Space Nerd","Science Geek","History Buff","Pirate Energy","Wizard Vibes","Fairy Core","Vampire Energy","Angel Aura","Lucky Duck","Certified Menace"
];

const comments = [
  {min:98,text:"💍 Soulmates. Wedding when?"},
  {min:90,text:"🥹 Destined to be together"},
  {min:80,text:"💚 Cute couple energy"},
  {min:70,text:"🌿 Actually a really solid match"},
  {min:60,text:"😳 There's definitely chemistry"},
  {min:50,text:"🤝 Could work with good communication"},
  {min:40,text:"🤔 Mixed signals..."},
  {min:30,text:"😬 Better as friends"},
  {min:20,text:"💀 This might end in disaster"},
  {min:10,text:"⚠️ Stay away from each other"},
  {min:0,text:"🚨 Absolutely cursed duo"}
];

function randomPersonality(){
  return personalities[Math.floor(Math.random()*personalities.length)];
}

document.getElementById("testLove").onclick = () => {

  const a = document.getElementById("person1").value.trim();
  const b = document.getElementById("person2").value.trim();

  if(!a || !b){
    alert("Enter two usernames!");
    return;
  }

  const percent = Math.floor(Math.random()*101);

  const p1 = randomPersonality();
  const p2 = randomPersonality();

  const verdict = comments.find(c => percent >= c.min).text;

  document.getElementById("loveResult").innerHTML = `
    <div style="font-size:68px;font-weight:900;color:#9af5a8;">
      ${percent}%
    </div>

    <h2 style="margin:8px 0;">${a} ❤️ ${b}</h2>

    <div style="
      margin:18px 0;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      border-radius:16px;
      padding:16px;
      text-align:left;
    ">
      <p><b>🐵 ${a}</b></p>
      <p>✨ ${p1}</p>

      <hr style="border:none;border-top:1px solid rgba(255,255,255,.08);margin:12px 0;">

      <p><b>🐵 ${b}</b></p>
      <p>✨ ${p2}</p>
    </div>

    <h3 style="color:#d8ffe0;">${verdict}</h3>
  `;
};

</script>

</body>
</html>
